name: CD
on:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: |
          for i in $(seq 1 30); do (echo > /dev/tcp/localhost/27017) 2>/dev/null && break; sleep 2; done
      - run: nohup node server.js > api.log 2>&1 &
      - name: Health check
        run: |
          for i in $(seq 1 20); do curl -sf http://localhost:3000/health && exit 0; sleep 2; done
          cat api.log; exit 1
      - run: npm test

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest