name: Product CI Prod
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/27017) 2>/dev/null && echo "mongo ready" && exit 0
            sleep 2
          done
          echo "mongo not ready"; exit 1
      - name: Start API
        run: nohup node server.js > api.log 2>&1 &
      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 2
          done
          cat api.log; exit 1
      - name: Run tests
        run: npm test